[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope"
version = "0.0.0"
description = "A staged, learning-focused reconstruction of AgentScope 2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai",
    "httpx",
    "jsonschema",
    "docstring-parser",
    "json-repair",
    "mcp",
]

[tool.setuptools.packages.find]
where = ["src"]
